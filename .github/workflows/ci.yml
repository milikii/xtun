name: Skill checks

on:
  push:
    branches: [main, refactor/xray-core-skill]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r .claude/skills/xray-core/scripts/requirements.txt
      - name: Verify pinned evidence
        run: python .claude/skills/xray-core/scripts/snapshot.py verify
      - name: Run offline tests
        run: python -m unittest discover -s .claude/skills/xray-core/tests
      - name: Check portable distribution
        run: python .claude/skills/xray-core/tests/check_distribution.py

# Real core build/handshake tests are deliberately not inferred from this job.
# They require a separately authorized run of tests/native_matrix.py using
# the exact core version, with --handshake only for explicitly enabled tests.
