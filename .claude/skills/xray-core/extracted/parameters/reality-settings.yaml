name: REALITYConfig
component: transport/internet/reality
verified_version: v26.9.9
track: prerelease
coverage: Selected fields, not a complete schema
source:
  docs: https://xtls.github.io/config/transports/reality.html
  commit: 52a412d9e2f5c2a5142b1b4e2ab3771dacb8b120
  local:
  - source/config/transport_security.go
  - source/transport/internet/reality/reality.go
  - source/transport/internet/tls/tls.go
notes: 握手强制条件还需 source/dependencies/reality/v26.9.9/tls.go；取消默认版本号限制不表示旧指纹重新兼容。
fields:
- name: target
  type: string or port number
  server_client: server-only
  notes: 当前名称，旧名 dest；target 非 nil 时覆盖 dest。存在目标字段时按服务端配置构建。
  required: true
  aliases:
  - dest
  alias_introduced: v24.10.16
- name: type
  type: string
  server_client: server-only
  notes: 通常由目标自动推导：@ 或 / 开头为 unix，有合法地址端口为 tcp；纯端口补 localhost。
- name: xver
  type: integer
  server_client: server-only
  notes: 目标侧 PROXY protocol 版本，仅接受 0、1、2。
  default: 0
- name: serverNames
  type: array of string
  server_client: server-only
  notes: 非空列表；列表可包含空字符串，用于无 SNI 客户端。
  required: true
- name: privateKey
  type: base64url without padding
  server_client: server-only
  notes: 解码后 32 字节的服务端私钥。
  required: true
- name: minClientVer / maxClientVer
  type: version string
  server_client: server-only
  notes: 显式客户端版本限制。v26.7.11 设置过默认最低版本 26.3.27；v26.9.8 取消该默认值，并由锁定的 REALITY 库检查 ClientHello。
  default: ''
- name: maxTimeDiff
  type: integer milliseconds
  server_client: server-only
  notes: 允许的时间差；0 不启用该限制。
  default: 0
- name: shortIds
  type: array of hex string
  server_client: server-only
  notes: 列表不得为空；每项为偶数长度十六进制，最长 16 字符；允许单个空字符串。
  required: true
- name: mldsa65Seed
  type: base64url without padding
  server_client: server-only
  notes: 解码后 32 字节的 ML-DSA-65 种子，不可与 privateKey 相同；目标证书等兼容要求另见官方文档。
- name: limitFallbackUpload / limitFallbackDownload
  type: LimitFallback object
  server_client: server-only
  notes: 回落流量限速；不是已认证代理流量限速。不把维护者的场景性建议当成强制默认。
- name: fingerprint
  type: string
  server_client: client-only
  notes: 文档建议显式填写；源码允许空值并选择 Chrome。拒绝 unsafe 与 hellogolang；能解析的指纹也不保证通过新版服务器握手检查。
  default: chrome
- name: serverName
  type: string
  server_client: client-only
  notes: 与服务端 serverNames 对应的 SNI；特殊无 SNI 用法按官网与目标版本核对。
- name: password
  type: base64url without padding
  server_client: client-only
  notes: 当前名称，旧名 publicKey；非空 password 优先。服务端私钥对应的 32 字节公钥，在 REALITY 设计中作为客户端持有的凭据。
  required: true
  aliases:
  - publicKey
  alias_introduced: v25.3.6
- name: shortId
  type: hex string
  server_client: client-only
  notes: 须匹配服务端 shortIds 的一项；最长 16 字符，允许空值的前提是服务端也允许。
  default: ''
- name: mldsa65Verify
  type: base64url without padding
  server_client: client-only
  notes: 解码后 1952 字节的 ML-DSA-65 验证公钥。
- name: spiderX
  type: string
  server_client: client-only
  notes: 以 / 开头；支持 p/c/t/i/r 查询参数。
  default: /
- name: show
  type: boolean
  server_client: server-and-client
  notes: 调试输出。
  default: false
- name: masterKeyLog
  type: string
  server_client: server-and-client
  notes: 调试用 NSS 密钥日志路径。
confidence: source-confirmed
