gaps:
- area: Rolling docs vs release behavior
  status: documented
  note: TLS allowInsecure prose and historical XHTTP defaults conflict with implemented behavior; source-conflicts.md
    records resolution
- area: Runtime snapshot
  status: partial
  note: Not a full build tree; uncollected protocol implementations and protobuf generated defaults may require
    the pinned upstream checkout
- area: Hysteria, TUN, WireGuard, Finalmask
  status: partial
  note: Official config/docs/transports are available; no complete field-by-field YAML extraction or behavior testing
- area: Translations and level-0 tutorials
  status: intentionally-omitted
  note: Chinese primary docs retained; links in untouched official docs to omitted translations/level-0 may not
    resolve locally
- area: Historical versions
  status: partial
  note: Two source baselines plus selected historical diffs; do not claim all past releases are fully snapshotted
- area: Maintainer discussion snapshots
  status: selected
  note: Main XHTTP post and selected issues/comments only; not a complete live discussion archive
